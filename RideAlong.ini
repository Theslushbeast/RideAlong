[General]
; Key that seats the nearest follower behind you on your horse, and lets them off again.
; DirectX scan code: 0x25 = K, 0x22 = G, 0x2F = V, 0x30 = B
Hotkey = 0x25
; 0 = the keyboard key does nothing (use the dialogue or the controller button instead)
HotkeyEnabled = 1

; Controller button that does the same when HELD (every button already does something while riding).
; 0 = none. 0x0001 D-pad Up, 0x0002 D-pad Down, 0x0004 D-pad Left, 0x0008 D-pad Right, 0x0010 Start,
; 0x0020 Back/View, 0x0040 Left stick click, 0x0080 Right stick click, 0x0100 LB, 0x0200 RB,
; 0x1000 A, 0x2000 B, 0x4000 X, 0x8000 Y, 0x0009 LT, 0x000A RT
GamepadButton = 0x0
GamepadHoldSeconds = 0.6

; 1 = followers have "Ride with me." / "You can get down now." in their dialogue (needs RideAlong.esp).
; Ask on foot and they climb on when you mount; ask from the saddle (if a mod lets you talk while mounted) and
; they climb on right away.
DialogueEnabled = 1

; How close (in game units, ~70 per metre) a follower must be when you press the key
Range = 1500

; 1 = the passenger stays out of fights while she rides (her weapon stays away; you can still talk to her)
PeacefulPassenger = 1

[Seat]
; Where the passenger sits, measured from the horse's saddle bone, in game units.
; BackOffset: further behind the saddle. UpOffset: higher / lower. SideOffset: + moves to the horse's right.
BackOffset = 34
UpOffset = -4
SideOffset = 0
AnchorNode = SaddleBone

[Animation]
; Animation event sent to the passenger when they get on, and when they get off.
PoseEvent = HorseEnterInstant
ExitEvent = IdleForceDefaultState

[Sync]
; Behavior-graph variables copied from you to the passenger every frame, so their riding animation follows the horse
SyncVariables = Speed,Direction,TurnDelta,SpeedSampled,IsSprinting,bIsSprinting,iSyncSprintState,fSpeedMult,HorseSpeed,TurnDeltaDamped,SpeedDamped
; 1 = write your and the passenger's animation variables to RideAlong.log (when boarding, and once while moving)
DumpGraphVariables = 0

[Pose]
; 1 = the passenger copies the leg movement of your riding animation every frame
CopyRiderPose = 1
; Bones the passenger copies from you (any bone whose name contains one of these words). By default only the
; legs, so they move with the horse while the rest of the body (and its cloth/hair physics) stays her own. Leave it empty to copy every bone.
;   add arms:        ,Clavicle,UpperArm,Forearm,Hand,Finger
;   add upper spine: ,Spine1,Spine2
CopyBones = Thigh,Calf,Foot,Toe,Pelvis
; Bones the passenger never copies (any bone whose name contains one of these words). Head and face are kept
; so they still look around and talk. Remove "Neck,Head" to make them copy your head movement too.
SkipBones = Head,Neck,Eye,Jaw,Tongue,Brow,Lip,Cheek,Mouth,Root,Weapon,Shield,Quiver,Sheath,Magic,Camera,Saddle,Hair
; Bones whose position is copied as well as their rotation (this carries the bounce of the gallop)
MoveBones =

[Dismount]
; 1 = the passenger plays a dismount animation on the seat before stepping down beside the horse
DismountAnimation = 1
; Animation event sent when getting off, and how long she stays on the seat while it plays
DismountEvent = HorseExit
DismountSeconds = 1.2

[Princess]
; Female passengers sit sideways ("princess" seat). Needs a sitting animation set up in OAR - see README_PrincessSeat.txt.
PrincessSeat = 1
; 1 = she still copies your leg movement (normally off: the OAR animation is her pose)
PrincessCopyPose = 0
; Where she sits and how far she is turned (degrees, + = facing the horse's right side)
PrincessBackOffset = 40.0
PrincessUpOffset = 3.0
PrincessSideOffset = 0
PrincessTurnDegrees = -11
; Dismount event for the princess seat (empty = DismountEvent). Use the princess animation mod's own if it has one.
PrincessDismountEvent =

; All of these can also be changed in game in SKSE Menu Framework (Ride Along > Settings), if it's installed.
